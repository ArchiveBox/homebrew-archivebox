name: Update ArchiveBox formula

on:
  workflow_dispatch:
    inputs:
      archivebox_ref:
        description: "ArchiveBox ref to package"
        required: false
        default: "dev"
      archivebox_sha:
        description: "Exact ArchiveBox commit SHA"
        required: false
      archivebox_version:
        description: "Exact ArchiveBox version"
        required: false
      archivebox_wheel_url:
        description: "Verified ArchiveBox wheel URL"
        required: false

permissions:
  contents: write

concurrency:
  group: update-archivebox-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@9651e3cfa42dae9ae90ca79eaa6d36dcd8569168

      - name: Update formula
        id: update
        env:
          ARCHIVEBOX_REF: ${{ inputs.archivebox_ref }}
          ARCHIVEBOX_SHA: ${{ inputs.archivebox_sha }}
        run: bin/build_brew.sh

      - name: Validate formula syntax
        if: steps.update.outputs.changed == 'true'
        run: ruby -c Formula/archivebox.rb

      - name: Install and test formula
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          tap_root="$(brew --repository)/Library/Taps/archivebox/homebrew-archivebox"
          mkdir -p "$(dirname "$tap_root")"
          if [[ -L "$tap_root" ]]; then
            rm "$tap_root"
          elif [[ -e "$tap_root" ]]; then
            echo "Unexpected non-symlink tap path: $tap_root" >&2
            exit 1
          fi
          ln -s "$PWD" "$tap_root"
          brew install --build-from-source ArchiveBox/archivebox/archivebox
          brew test ArchiveBox/archivebox/archivebox

      - name: Commit formula update
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/archivebox.rb
          if git diff --cached --quiet -- Formula/archivebox.rb; then
            echo "Generated formula update was lost before publication." >&2
            exit 1
          fi
          git commit -m "Update ArchiveBox dev formula to ${{ steps.update.outputs.formula_version }}"
          git push origin HEAD:main
