name: Update ArchiveBox formula

on:
  workflow_dispatch:
  repository_dispatch:
    types: [archivebox-release]

permissions:
  contents: write

concurrency:
  group: update-archivebox-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update formula
        id: update
        env:
          ARCHIVEBOX_REF: ${{ github.event.client_payload.ref || 'dev' }}
          ARCHIVEBOX_SHA: ${{ github.event.client_payload.sha || '' }}
        run: bin/build_brew.sh

      - name: Validate formula syntax
        run: ruby -c Formula/archivebox.rb

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Install and test formula
        run: |
          set -Eeuo pipefail
          tap_root="$(brew --repository)/Library/Taps/archivebox/homebrew-archivebox"
          mkdir -p "$(dirname "$tap_root")"
          if [[ -L "$tap_root" ]]; then
            rm "$tap_root"
          elif [[ -e "$tap_root" ]]; then
            echo "Unexpected non-symlink tap path: $tap_root" >&2
            exit 1
          fi
          ln -s "$PWD" "$tap_root"
          brew install --build-from-source ArchiveBox/archivebox/archivebox
          brew test ArchiveBox/archivebox/archivebox

      - name: Commit formula update
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/archivebox.rb
          if git diff --cached --quiet -- Formula/archivebox.rb; then
            echo "Formula/archivebox.rb already matches the generated formula"
            exit 0
          fi
          git commit -m "Update ArchiveBox dev formula to ${{ steps.update.outputs.formula_version }}"
          git push
