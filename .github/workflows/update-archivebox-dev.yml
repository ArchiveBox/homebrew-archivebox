name: Update ArchiveBox dev formula

on:
  workflow_dispatch:
  repository_dispatch:
    types: [archivebox-dev-updated]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: update-archivebox-dev-formula
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Update formula
        id: update
        run: bin/build_brew.sh

      - name: Validate formula syntax
        run: ruby -c Formula/archivebox.rb

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@main

      - name: Wait for ArchiveBox dependency wheels
        run: |
          set -Eeuo pipefail
          python - <<'PY'
          import re
          import subprocess
          import sys
          import tempfile
          import time
          import tomllib
          import urllib.request
          from pathlib import Path

          with tempfile.TemporaryDirectory(prefix="archivebox-dev-") as tmpdir:
              checkout = Path(tmpdir) / "ArchiveBox"
              subprocess.check_call([
                  "git",
                  "clone",
                  "--depth=1",
                  "--branch=dev",
                  "--filter=blob:none",
                  "https://github.com/ArchiveBox/ArchiveBox.git",
                  str(checkout),
              ])
              deps = tomllib.loads((checkout / "pyproject.toml").read_text())["project"]["dependencies"]

          watched = {"abxbus", "abxpkg", "abx-plugins", "abx-dl"}
          required = {}
          for dep in deps:
              for name in watched:
                  match = re.match(rf"{re.escape(name)}\s*(==|>=)\s*([^,;\s]+)", dep)
                  if match:
                      required[name] = match.group(2)

          deadline = time.monotonic() + 600
          missing = required.copy()
          while missing and time.monotonic() < deadline:
              for name, version in list(missing.items()):
                  try:
                      with urllib.request.urlopen(f"https://pypi.org/pypi/{name}/{version}/json", timeout=20):
                          print(f"{name} {version} is available on PyPI")
                          missing.pop(name)
                  except Exception:
                      print(f"{name} {version} is not available on PyPI yet")
              if missing:
                  time.sleep(10)

          if missing:
              print(f"Missing PyPI releases after wait: {missing}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Install and test formula
        run: |
          set -Eeuo pipefail
          tap_root="$(brew --repository)/Library/Taps/archivebox/homebrew-archivebox"
          mkdir -p "$(dirname "$tap_root")"
          if [[ -L "$tap_root" ]]; then
            rm "$tap_root"
          elif [[ -e "$tap_root" ]]; then
            echo "Unexpected non-symlink tap path: $tap_root" >&2
            exit 1
          fi
          ln -s "$PWD" "$tap_root"
          brew install --build-from-source ArchiveBox/archivebox/archivebox
          brew test ArchiveBox/archivebox/archivebox

      - name: Commit formula update
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/archivebox.rb
          git commit -m "Update ArchiveBox dev formula to ${{ steps.update.outputs.formula_version }}"
          git push
