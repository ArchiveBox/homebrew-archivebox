name: Update ArchiveBox formula

on:
  workflow_dispatch:
    inputs:
      archivebox_version:
        description: "Exact ArchiveBox version"
        required: true

permissions:
  contents: write

concurrency:
  group: update-archivebox-formula
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"

      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@9651e3cfa42dae9ae90ca79eaa6d36dcd8569168

      # setup-homebrew replaces the tap checkout in-place, including the
      # authenticated remote configured by actions/checkout.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Update formula
        id: update
        env:
          ARCHIVEBOX_VERSION: ${{ inputs.archivebox_version }}
        run: bin/build_brew.sh

      - name: Validate formula syntax
        run: ruby -c Formula/archivebox.rb

      - name: Install and test formula
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          tap_root="$(brew --repository)/Library/Taps/archivebox/homebrew-archivebox"
          mkdir -p "$(dirname "$tap_root")"
          if [[ -L "$tap_root" ]]; then
            rm "$tap_root"
          elif [[ -e "$tap_root" ]]; then
            echo "Unexpected non-symlink tap path: $tap_root" >&2
            exit 1
          fi
          ln -s "$PWD" "$tap_root"
          brew install --build-bottle ArchiveBox/archivebox/archivebox
          brew test ArchiveBox/archivebox/archivebox

      - name: Validate runtime dependency install
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          data_dir="$(mktemp -d)"
          cd "$data_dir"
          archivebox init
          archivebox install

      - name: Build Linux bottle
        if: steps.update.outputs.changed == 'true'
        run: |
          set -Eeuo pipefail
          root_url="https://raw.githubusercontent.com/ArchiveBox/homebrew-archivebox/main/Bottles"
          brew bottle --json --no-rebuild --root-url="$root_url" ArchiveBox/archivebox/archivebox
          bottle_json="$(find . -maxdepth 1 -name 'archivebox--*.bottle.json' -print -quit)"
          readarray -t bottle_names < <(python3 - "$bottle_json" <<'PY'
          import json
          import sys

          bottle = next(iter(json.load(open(sys.argv[1], encoding="utf-8")).values()))["bottle"]
          tag = next(iter(bottle["tags"].values()))
          print(tag["local_filename"])
          print(tag["filename"])
          PY
          )
          test "${#bottle_names[@]}" -eq 2
          mkdir -p Bottles
          mv "${bottle_names[0]}" "Bottles/${bottle_names[1]}"
          brew bottle --merge --write --no-commit "$bottle_json"
          test -s "Bottles/${bottle_names[1]}"
          grep -q 'x86_64_linux:' Formula/archivebox.rb

      - name: Commit formula update
        if: steps.update.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/archivebox.rb Bottles/
          if git diff --cached --quiet -- Formula/archivebox.rb Bottles/; then
            echo "Generated formula update was lost before publication." >&2
            exit 1
          fi
          git commit -m "Update ArchiveBox dev formula to ${{ steps.update.outputs.formula_version }}"
          git push origin HEAD:main
